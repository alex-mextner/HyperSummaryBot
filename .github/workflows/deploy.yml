name: Deploy to DigitalOcean
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact tested SHA
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: RELEASE_SHA
          script_stop: true
          script: |
            set -euo pipefail
            APP=/var/www/hyper-summary-bot
            BUN=/var/www/.bun/bin/bun
            PM2=/var/www/.bun/bin/pm2
            test -d "$APP/.git" && test -x "$BUN" && test -x "$PM2" && test -f "$APP/.env"
            cd "$APP"
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'tracked production tree is dirty'; exit 1; }
            git fetch origin "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            "$BUN" install --frozen-lockfile
            "$BUN" run db:migrate
            "$PM2" reload ecosystem.config.js --update-env
            sleep 3
            "$PM2" describe hyper-summary-bot | grep -q 'online'
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
