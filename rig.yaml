# rig.yaml — declarative setup for this repo, applied by `rig apply`.
# COMMITTED BY DEFAULT: this file is the reproducible source of truth.
# Global defaults live at ~/.config/rig/config.yaml; this file overrides them.
# See: rig status (drift), rig apply (converge). Schema: docs/config-schema.md
#
# Provisioned by rig rollout wave-2. Adds the universal skills layer, agent-hooks,
# the secret-scan git-hook dispatcher fragment, and the CI governance gates. The
# repo's existing deploy.yml workflow is untouched.

version: 1
scope: both
defaults:
  skills_target: ~/.agents/skills
  hooks_target: ~/.claude/hooks
  ci_target: .github/workflows
  mcp_target: ~/.claude/mcp
  on_conflict: backup
skills:
  enabled: true
  target: ~/.agents/skills
  universal:
    all: true
    disable: []
  by_type:
    enable: []
agent_hooks:
  enabled: true
  target: ~/.claude/hooks
  target_kind: claude-code
  all: true
git_hooks:
  dispatcher:
    enabled: true
    dir: ~/.config/git/global-hooks.d
    runner: ~/.config/git/run-global-hooks
    set_global_hooks_path: true
    install_local_retrofit_script: true
    fragments:
      secret-scan:
        enabled: true
ci:
  enabled: true
  target: .github/workflows
  all: false
  items:
    secret-scan:
      enabled: true
      tier: block
    codeql:
      enabled: true
      tier: block
      variant: selfgate
    dependency-review:
      enabled: true
      tier: block
    leftover-grep:
      enabled: true
      tier: block
    review-threads:
      enabled: true
      tier: block
    ship:
      enabled: true
      install_to: ~/bin
      gh_alias: true
mcp:
  enabled: true
  target: ~/.claude/mcp
  items: {}
harness:
  enabled: true
  kind: claude-code
  auto_mode: true

# PR application bytes run only through the installed, bounded stage receiver.
bot_stage:
  enabled: true
  checks:
  - bun x tsc --noEmit
  - bun run lint
  - bun run fmt:check
  - bun run test
  dockerfile: .rig/stage.Dockerfile
  submodules: false
  policy:
    id: summary
    repository: alex-mextner/HyperSummaryBot
    image: ghcr.io/alex-mextner/hypersummarybot-stage
    telegram_username: HyperSummaryStageBot
    architecture: amd64
    qa: false
    env_allowlist:
    - BOT_TOKEN
    required_env:
    - BOT_TOKEN
    defaults:
      NODE_ENV: production
      BOT_USERNAME: HyperSummaryStageBot
      RIG_STAGE_LIMITED: 'true'
      DATABASE_PATH: /app/data/stage.db
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    network_hosts:
    - api.telegram.org
    memory_mb: 384
    cpus: 0.5
    pids: 128
    ttl_seconds: 1800
    redis: false
