name: Deploy to odroid
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
  deploy:
    needs: test
    # Self-hosted runner on the home server (www-data, /var/www/actions-runner-hsb).
    # Only push/workflow_dispatch trigger this job, so fork PR code never runs here.
    runs-on: [self-hosted, odroid, hyper-summary-bot]
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Deploy exact tested SHA
        run: |
          set -euo pipefail
          # PM2's CLI must run under Node: under Bun it crashes talking to the daemon.
          export PATH=/var/www/.nvm/versions/node/v22.17.0/bin:/var/www/.bun/bin:/usr/local/bin:/usr/bin:/bin
          export HOME=/var/www PM2_HOME=/var/www/.pm2
          APP=/var/www/hyper-summary-bot
          test -d "$APP/.git" && test -f "$APP/.env"
          command -v bun && command -v pm2 && command -v node && command -v curl
          cd "$APP"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo 'tracked production tree is dirty'; exit 1; }
          git fetch origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bun install --frozen-lockfile
          bun run db:migrate
          pm2 reload ecosystem.config.cjs --update-env
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            if curl -fsS --max-time 3 http://127.0.0.1:3003/healthz | grep -q "\"buildSha\":\"$RELEASE_SHA\""; then
              pm2 describe hyper-summary-bot | grep -q 'online'
              # Persist the process list so pm2-www-data.service resurrects the bot after a reboot.
              pm2 save
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not report $RELEASE_SHA within 90s"
          exit 1
