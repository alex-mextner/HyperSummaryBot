# Generated by rig bot_stage. PR CI builds data; the installed controller owns deployment.
name: Rig stage build
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
permissions:
  contents: read
concurrency:
  group: rig-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
        submodules: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile
    - run: bun x tsc --noEmit
    - run: bun run lint
    - run: bun run fmt:check
    - run: bun run test
  build:
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
        submodules: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: .rig/stage.Dockerfile
        platforms: linux/amd64
        push: false
        load: true
        labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
        tags: ghcr.io/alex-mextner/hypersummarybot-stage:${{ github.event.pull_request.head.sha }}
        provenance: false
    - name: Save stage image
      env:
        STAGE_SHA: ${{ github.event.pull_request.head.sha }}
      run: 'set -euo pipefail

        mkdir -p stage-artifact

        docker save "ghcr.io/alex-mextner/hypersummarybot-stage:$STAGE_SHA" | gzip -1 > stage-artifact/image.tar.gz

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stage-${{ github.event.pull_request.head.sha }}
        path: stage-artifact/image.tar.gz
        if-no-files-found: error
        retention-days: 2
        overwrite: true
        compression-level: 0
